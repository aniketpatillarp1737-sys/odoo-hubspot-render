# Render Blueprint - Free Tier
# Odoo + HubSpot Integration

services:
  - type: web
    name: odoo-hubspot
    runtime: docker
    plan: free                    # Free tier
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /web/login
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8069"
      - key: DB_HOST
        fromDatabase:
          name: odoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: odoo-db
          property: database
    # Note: Free web services do NOT support persistent disks.
    # Odoo filestore will reset on every redeploy / spin-down.
    # For testing this is acceptable.

databases:
  - name: odoo-db
    plan: free                    # Free PostgreSQL (expires after ~90 days)
    databaseName: odoo
    user: odoo
